<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Урок 08.10 – Картка тарифного плану</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Заголовок сторінки -->
    <h1 id="pricing-header">ТАРИФИ ТА ПОСЛУГИ</h1>

    <!-- Головний блок картки тарифу -->
    <div class="plan-card">
        <!-- Бейдж / Мітка тарифу -->
        <p class="plan-badge">★ Найпопулярніший</p>

        <!-- Назва тарифного плану -->
        <h2 class="plan-title">Тариф PRO</h2>

        <!-- Призначення тарифу -->
        <p class="plan-subtitle">Ідеально для фрілансерів та малих команд</p>

        <!-- Стара ціна -->
        <p class="price-old">Звичайна ціна: $39 / міс</p>

        <!-- Нова / Акційна ціна -->
        <p class="price-main">$29 / місяць</p>

        <!-- Перелік можливостей -->
        <ul class="plan-features">
            <li>Безлімітні веб-проєкти</li>
            <li>Доступ до всіх преміум-шаблонів</li>
            <li>Пріоритетна підтримка 24/7</li>
            <li>Безкоштовний SSL-сертифікат</li>
            <li>100 GB у хмарному сховищі</li>
        </ul>

        <!-- Кнопка вибору -->
        <a href="#" class="btn-select">Обрати тариф</a>
    </div>

</body>
</html>
